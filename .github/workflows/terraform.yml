name: Terraform Feature Branch - Security Scan, Plan and Apply

on:
  push:
    branches:
      - "feature/**"
      - "main"

permissions:
  contents: read

jobs:

  # =========================================================
  # STAGE 1 - SECURITY SCAN
  # Only Feature Branch
  # =========================================================
  security-scan:
    name: Stage 1 - Security Scan
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/heads/feature/')

    defaults:
      run:
        working-directory: ./azurerm_storage_account

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest


      - name: Terraform Format Check
        run: terraform fmt -recursive


      # =========================================================
      # TFLint
      # =========================================================
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5


      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive


      # =========================================================
      # tfsec
      # =========================================================
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ./azurerm_storage_account


      # =========================================================
      # Checkov
      # =========================================================
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./azurerm_storage_account
          framework: terraform


      # =========================================================
      # Infracost
      # =========================================================
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}


      - name: Run Infracost
        run: |
          infracost breakdown \
            --path=. \
            --format=table



  # =========================================================
  # STAGE 2 - TERRAFORM PLAN
  # Only Feature Branch
  # =========================================================
  terraform-plan:
    name: Stage 2 - Terraform Plan
    runs-on: ubuntu-latest

    needs: security-scan

    if: startsWith(github.ref, 'refs/heads/feature/')

    defaults:
      run:
        working-directory: ./azurerm_storage_account

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest


      # =========================================================
      # Azure Login
      # =========================================================
      - name: Azure Login Using Service Principal
        run: |
          az login \
            --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}"

          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"


      - name: Verify Azure Login
        run: az account show --output table


      # =========================================================
      # Terraform Init
      # =========================================================
      - name: Terraform Init
        run: terraform init -input=false


      # =========================================================
      # Terraform Validate
      # =========================================================
      - name: Terraform Validate
        run: terraform validate


      # =========================================================
      # Terraform Plan
      # =========================================================
      - name: Terraform Plan
        run: terraform plan -input=false -no-color



  # =========================================================
  # STAGE 3 - TERRAFORM PLAN & APPLY
  # Only Main Branch
  # =========================================================
  terraform-apply:
    name: Stage 3 - Terraform Plan and Apply
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ./azurerm_storage_account

    steps:

      # =========================================================
      # STEP 1 - Checkout Repository
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # STEP 2 - Setup Terraform
      # =========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest


      # =========================================================
      # STEP 3 - Azure Login
      # =========================================================
      - name: Azure Login Using Service Principal
        run: |
          az login \
            --service-principal \
            --username "d9bc2374-158d-4c21-8c6a-ce6fa1b4a924" \
            --password "xVF8Q~z.lN6HVQgnOhX1UFSu7LG6u7mSEviWFaM3" \
            --tenant "91695fd6-371b-4c10-8dc9-21e31d347ad6"

          az account set \
            --subscription "b299f192-d573-4040-b542-2aff90a974b5"


      # =========================================================
      # STEP 4 - Verify Azure Login
      # =========================================================
      - name: Verify Azure Login
        run: az account show --output table


      # =========================================================
      # STEP 5 - Terraform Init
      # =========================================================
      - name: Terraform Init
        run: terraform init -input=false


      # =========================================================
      # STEP 6 - Terraform Validate
      # =========================================================
      - name: Terraform Validate
        run: terraform validate


      # =========================================================
      # STEP 7 - Terraform Plan
      # Save Plan File
      # =========================================================
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan


      # =========================================================
      # STEP 8 - Terraform Apply
      # Apply Exactly Same Plan
      # =========================================================
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan